aid: spartan-radar
name: Spartan Radar
description: 'Spartan Radar is an automotive radar software and sensing company, now
  operating as the radar technology brand of Pro-Vision Solutions, LLC following its
  2025 acquisition. Its Clarify software applies proprietary digital signal processing
  and machine-learning perception to existing automotive radar sensors, raising resolution
  3-8x on commodity silicon (ARM Cortex, Texas Instruments TDA4VM and AWR, NVIDIA Orin
  and DRIVE, NXP SAF85xx/SAF86xx) without new hardware, and its Hoplo product is a
  software-defined collision-avoidance and blind-spot warning system for commercial
  and heavy vehicles across mining, construction, material handling and logistics.
  Spartan sells to commercial-vehicle OEMs, Tier 1 suppliers and fleet operators as
  embedded software and hardware; it publishes no public developer program, API, SDK
  or machine-readable interface contract.'
